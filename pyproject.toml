[project]
name = "runpod-log"
version = "1.0.0"
description = "CLI tool for fetching RunPod pod logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
]

[project.scripts]
runpod-log = "runpod_log.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_log"]
